```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administration | Junior Bakanzo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #071a33;
        }

        header {
            background: #071a33;
            color: white;
            padding: 22px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 6px 0 0;
            color: #c9d8ea;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #b02a37;
        }

        main {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
            border-left: 5px solid #0b5ed7;
        }

        .stat-card h3 {
            margin: 0 0 12px;
            color: #667085;
            font-size: 15px;
        }

        .stat-card .number {
            font-size: 30px;
            font-weight: bold;
            color: #071a33;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .table-header h2 {
            margin: 0;
        }

        .refresh-btn {
            background: #0b5ed7;
            color: white;
            border: none;
            padding: 10px 17px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn:hover {
            background: #084298;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #071a33;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f8fbff;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 750px) {

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .table-header {
                flex-direction: column;
                align-items: flex-start;
            }

        }
    </style>
</head>

<body>

<header>

    <div>
        <h1>Administration</h1>

        <p>
            Gestion des inscriptions — Junior Bakanzo
        </p>
    </div>

    <button
        class="logout-btn"
        id="logoutBtn"
    >
        🚪 Déconnexion
    </button>

</header>


<main>

    <!-- STATISTIQUES -->

    <section class="stats">

        <div class="stat-card">

            <h3>
                Total des inscriptions
            </h3>

            <div
                class="number"
                id="total"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Dernière inscription
            </h3>

            <div
                class="number"
                id="latest"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Activités
            </h3>

            <div
                class="number"
                id="activities"
            >
                0
            </div>

        </div>

    </section>


    <!-- TABLEAU -->

    <section class="table-container">

        <div class="table-header">

            <h2>
                Liste des participants
            </h2>

            <button
                class="refresh-btn"
                id="refreshBtn"
            >
                🔄 Actualiser
            </button>

        </div>


        <table>

            <thead>

                <tr>

                    <th>#</th>

                    <th>Nom</th>

                    <th>E-mail</th>

                    <th>Téléphone</th>

                    <th>Activité</th>

                    <th>Date</th>

                </tr>

            </thead>


            <tbody id="tableBody">

                <tr>

                    <td
                        colspan="6"
                        class="empty"
                    >
                        Chargement...

                    </td>

                </tr>

            </tbody>

        </table>

    </section>

</main>


<footer>

    © 2026 Junior Bakanzo — Espace Administration

</footer>


<script>

    // ========================================
    // CHARGER LES INSCRIPTIONS
    // ========================================

    async function loadRegistrations() {

        const tableBody =
            document.getElementById("tableBody");

        try {

            const response =
                await fetch("/api/inscriptions");

            if (response.status === 401) {

                window.location.href =
                    "/login.html";

                return;

            }

            const registrations =
                await response.json();


            // STATISTIQUES

            document.getElementById("total")
                .textContent =
                registrations.length;


            if (registrations.length > 0) {

                document.getElementById("latest")
                    .textContent =
                    registrations[0].nom;

            } else {

                document.getElementById("latest")
                    .textContent =
                    "Aucune";

            }


            const uniqueActivities =
                new Set(
                    registrations.map(
                        item => item.activite
                    )
                );

            document.getElementById("activities")
                .textContent =
                uniqueActivities.size;


            // TABLEAU

            tableBody.innerHTML = "";


            if (registrations.length === 0) {

                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="empty"
                        >
                            Aucune inscription pour le moment.

                        </td>

                    </tr>

                `;

                return;

            }


            registrations.forEach(
                (registration, index) => {

                    const row =
                        document.createElement("tr");

                    row.innerHTML = `

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${registration.nom}
                        </td>

                        <td>
                            ${registration.email}
                        </td>

                        <td>
                            ${registration.telephone}
                        </td>

                        <td>
                            ${registration.activite}
                        </td>

                        <td>
                            ${registration.date_inscription}
                        </td>

                    `;

                    tableBody.appendChild(row);

                }
            );

        } catch (error) {

            console.error(error);

            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="empty"
                    >
                        ❌ Impossible de charger les inscriptions.

                    </td>

                </tr>

            `;

        }

    }


    // ========================================
    // ACTUALISER
    // ========================================

    document
        .getElementById("refreshBtn")
        .addEventListener(
            "click",
            loadRegistrations
        );


    // ========================================
    // DÉCONNEXION
    // ========================================

    document
        .getElementById("logoutBtn")
        .addEventListener(
            "click",
            async function() {

                try {

                    await fetch(
                        "/api/logout",
                        {
                            method: "POST"
                        }
                    );

                } catch (error) {

                    console.error(error);

                }

                window.location.href =
                    "/login.html";

            }
        );


    // ========================================
    // CHARGEMENT INITIAL
    // ========================================

    loadRegistrations();

</script>

</body>
</html>
```
