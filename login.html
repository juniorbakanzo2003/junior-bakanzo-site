```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion administrateur | Junior Bakanzo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071a33, #0b5ed7);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        h1 {
            margin-top: 0;
            color: #071a33;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #071a33;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #0b5ed7;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0b5ed7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #084298;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b5ed7;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Administration</h1>

        <p class="subtitle">
            Connectez-vous à votre espace administrateur
        </p>

        <form id="loginForm">

            <label for="username">
                Identifiant
            </label>

            <input
                type="text"
                id="username"
                placeholder="Entrez votre identifiant"
                required
            >

            <label for="password">
                Mot de passe
            </label>

            <input
                type="password"
                id="password"
                placeholder="Entrez votre mot de passe"
                required
            >

            <button type="submit">
                Se connecter
            </button>

        </form>

        <p id="message"></p>

        <a href="/" class="back">
            ← Retour au site
        </a>

    </div>


    <script>

        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            message.textContent =
                "⏳ Connexion en cours...";

            try {

                const response = await fetch("/api/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })

                });

                const data = await response.json();

                if (data.success) {

                    message.textContent =
                        "✅ Connexion réussie...";

                    setTimeout(() => {

                        window.location.href =
                            "/admin.html";

                    }, 500);

                } else {

                    message.textContent =
                        "❌ " + data.message;

                }

            } catch (error) {

                console.error(error);

                message.textContent =
                    "❌ Impossible de contacter le serveur.";

            }

        });

    </script>

</body>
</html>
